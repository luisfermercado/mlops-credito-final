name: Build y Deploy a Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:   # permite relanzar el despliegue a mano desde la pestaña Actions

# Recursos del Módulo 3 que se reutilizan (Resource Group, Environment, Registry) y la app nueva del proyecto final.
env:
  RESOURCE_GROUP: rg-mlops-ean
  ACR_NAME: acrluisfermlops
  ENVIRONMENT: env-mi-proyecto
  APP_NAME: api-credito-final
  IMAGE_NAME: api-credito-final

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Paso 1 — Descargar el código del repositorio
      - name: Checkout
        uses: actions/checkout@v4

      # Paso 2 — Autenticarse en Azure con el Service Principal
      - name: Login en Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Paso 3 — Construir la imagen Docker
      - name: Login en Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build de la imagen
        run: |
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} \
                       -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest .

      # Paso 4 — Subir la imagen al Container Registry
      - name: Push al Container Registry
        run: |
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest

      # Paso 5 — Desplegar en Azure Container Apps (crea la app la primera vez, la actualiza después)
      - name: Deploy en Azure Container Apps
        uses: azure/cli@v2
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          DATABRICKS_URL: ${{ secrets.DATABRICKS_URL }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        with:
          azcliversion: latest
          inlineScript: |
            set -e
            az config set extension.use_dynamic_install=yes_without_prompt

            # Limpieza de los secretos: elimina espacios y saltos de línea invisibles que pueden
            # quedar al copiarlos (por ejemplo con pbcopy). Docker los tolera, az containerapp no.
            ACR_USERNAME=$(printf '%s' "$ACR_USERNAME" | tr -d '[:space:]')
            ACR_PASSWORD=$(printf '%s' "$ACR_PASSWORD" | tr -d '[:space:]')

            # Credencial vigente del registry leída directamente de Azure (el Service Principal
            # tiene permiso sobre el Resource Group). Evita fallos si el secreto quedó desactualizado.
            ACR_USER_AZ=$(az acr credential show --name "$ACR_NAME" --query username --output tsv)
            ACR_PASS_AZ=$(az acr credential show --name "$ACR_NAME" --query "passwords[0].value" --output tsv)
            echo "::add-mask::$ACR_PASS_AZ"
            if [ "$ACR_PASSWORD" = "$ACR_PASS_AZ" ]; then
              echo "Diagnóstico: el secreto ACR_PASSWORD coincide con el password vigente del registry"
            else
              echo "Diagnóstico: el secreto ACR_PASSWORD NO coincide con el password vigente; se usa el de Azure"
            fi
            ACR_USERNAME="$ACR_USER_AZ"
            ACR_PASSWORD="$ACR_PASS_AZ"
            DATABRICKS_URL=$(printf '%s' "$DATABRICKS_URL" | tr -d '[:space:]')
            DATABRICKS_TOKEN=$(printf '%s' "$DATABRICKS_TOKEN" | tr -d '[:space:]')
            IMAGE="$ACR_NAME.azurecr.io/$IMAGE_NAME:$GITHUB_SHA"

            if az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" > /dev/null 2>&1; then
              echo "La app existe: actualizando credencial del registry, imagen y secretos"
              az containerapp registry set --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
                --server "$ACR_NAME.azurecr.io" --username "$ACR_USERNAME" --password "$ACR_PASSWORD"
              az containerapp secret set --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
                --secrets databricks-url="$DATABRICKS_URL" databricks-token="$DATABRICKS_TOKEN"
              az containerapp update --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
                --image "$IMAGE" \
                --set-env-vars DATABRICKS_URL=secretref:databricks-url DATABRICKS_TOKEN=secretref:databricks-token \
                --min-replicas 1 --max-replicas 1
            else
              echo "Primera vez: creando la app"
              az containerapp create --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
                --environment "$ENVIRONMENT" \
                --image "$IMAGE" \
                --registry-server "$ACR_NAME.azurecr.io" \
                --registry-username "$ACR_USERNAME" --registry-password "$ACR_PASSWORD" \
                --target-port 8000 --ingress external \
                --min-replicas 1 --max-replicas 1 \
                --secrets databricks-url="$DATABRICKS_URL" databricks-token="$DATABRICKS_TOKEN" \
                --env-vars DATABRICKS_URL=secretref:databricks-url DATABRICKS_TOKEN=secretref:databricks-token
            fi

            URL=$(az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
                  --query properties.configuration.ingress.fqdn --output tsv)
            echo "API publicada en: https://$URL"
            echo "Documentación:    https://$URL/docs"
